<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Crunchyroll Auto Skip</title>
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="mark">»</div>
        <div>
          <h1>Auto Skip</h1>
          <p class="sub">for Crunchyroll</p>
        </div>
        <label class="switch master">
          <input type="checkbox" id="enabled" />
          <span class="track"></span>
        </label>
      </header>

      <section class="card" id="body">
        <h2>Skip</h2>
        <label class="row">
          <span>Intros / openings</span>
          <span class="switch"><input type="checkbox" id="skipIntro" /><span class="track"></span></span>
        </label>
        <label class="row">
          <span>Recaps</span>
          <span class="switch"><input type="checkbox" id="skipRecap" /><span class="track"></span></span>
        </label>
        <label class="row">
          <span>Credits / outros</span>
          <span class="switch"><input type="checkbox" id="skipOutro" /><span class="track"></span></span>
        </label>
        <label class="row">
          <span>Anything else labelled "skip"</span>
          <span class="switch"><input type="checkbox" id="skipOther" /><span class="track"></span></span>
        </label>

        <h2>Also</h2>
        <label class="row">
          <span>Jump straight to the next episode<em>Skips the up-next countdown</em></span>
          <span class="switch"><input type="checkbox" id="autoNextEpisode" /><span class="track"></span></span>
        </label>
        <label class="row">
          <span>Dismiss "still watching?"</span>
          <span class="switch"><input type="checkbox" id="dismissStillWatching" /><span class="track"></span></span>
        </label>
        <label class="row">
          <span>Show a little toast when it skips</span>
          <span class="switch"><input type="checkbox" id="showToast" /><span class="track"></span></span>
        </label>
        <label class="row">
          <span>Debug logging<em>Logs every skip-like button and why it was rejected, to the console</em></span>
          <span class="switch"><input type="checkbox" id="debug" /><span class="track"></span></span>
        </label>

        <h2>Timing</h2>
        <div class="row slider">
          <span>Wait before skipping <b id="delayLabel">0.00s</b><em>Give yourself a moment to cancel</em></span>
          <input type="range" id="delayMs" min="0" max="5000" step="250" />
        </div>
      </section>

      <footer>
        <span id="stats">No skips yet</span>
        <button id="reset" type="button">Reset</button>
      </footer>
    </div>

    <script src="settings.js"></script>
  </body>
</html>
